[package]
name = "beancount-ast-py"
version = '0.0.0'
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beancount-parser = { git = "https://github.com/trim21/beancount.git", rev = "079bd1db77e09ad030329c6ec30744ed42a938d3" }
pyderive = "0.9.2"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "multiple-pymethods", "generate-import-lib"] }

[features]
default = []
